[package]
name = "hopper-cli"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Command-line tooling for Hopper account inspection, schema export, and migration planning"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-cli/0.3.0"
readme = "README.md"
keywords = ["solana", "zero-copy", "cli", "schema", "accounts"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hopper"
path = "src/main.rs"

[dependencies]
hopper-schema = { workspace = true, features = ["receipt", "policy"] }
hopper-manager = { workspace = true }
# The independent effect verifier powers `hopper verify --effects` (the C7
# release gate). `cli` pulls the offline evidence-bundle parser; the CLI is
# already a std host tool, so the extra serde is free here.
grillo-verifier = { path = "../../crates/grillo-verifier", version = "0.1.0", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
solana-client = "2.1"
solana-commitment-config = "2.1"
solana-compute-budget-interface = "2.1"
solana-instruction = "2.1"
solana-keypair = "2.1"
solana-pubkey = "2.1"
solana-signature = "2.1"
solana-signer = "2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-transaction = { version = "2.1", features = ["bincode"] }
solana-transaction-error = "2.1"
solana-transaction-status = "2.1"
bincode = "1.3"

# On-chain RPC + PDA derivation
ureq = "2"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
curve25519-dalek = { version = "4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib"] }

# Interactive TUI
crossterm = "0.28"

# ELF + DWARF for `hopper profile elf`
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1"

# Source walking for `hopper lint` and `hopper expand`
syn = { version = "2", features = ["full", "extra-traits", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
walkdir = "2"

# Cross-platform host RNG for `hopper keys new`
getrandom = "0.2"

# Interactive `hopper init` wizard
dialoguer = "0.11"
# Global config file location (`~/.hopper/config.toml`)
dirs = "6"

[dev-dependencies]
# `write` lets tests synthesize minimal DWARF in-memory for the
# `profile elf --inlines` walker - no binary fixtures checked in, no
# external toolchain needed to regenerate them. Dev-only: the shipping
# binary keeps the read-only gimli above.
gimli = { version = "0.31", default-features = false, features = ["read", "std", "write"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

