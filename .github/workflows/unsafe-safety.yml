name: Unsafe safety comments

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unsafe-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test release provenance and unsafe scanners
        run: python3 scripts/tests/test_release_provenance.py
      - name: Check unsafe safety comments and inventory
        run: python3 scripts/check-unsafe-safety-comments.py --require-clean --inventory-out target/hopper/release/unsafe-inventory.md
      - name: Upload unsafe inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsafe-inventory
          if-no-files-found: error
          retention-days: 90
          path: target/hopper/release/unsafe-inventory.md
