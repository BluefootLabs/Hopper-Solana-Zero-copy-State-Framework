name: Unsafe safety comments

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unsafe-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check unsafe safety comments and inventory
        run: python3 scripts/check-unsafe-safety-comments.py --inventory-out unsafe-inventory.md
      - name: Upload unsafe inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsafe-inventory
          path: unsafe-inventory.md
        