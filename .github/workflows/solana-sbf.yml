name: Solana SBF gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbf:
    name: Agave 2.3.13 compile compatibility + Cicada SBF harness
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AGAVE_VERSION: v2.3.13
      AGAVE_ARCHIVE_SHA256: c43539ebdf6942472e8b87635d6ea55f428a51e3d0219f7b6f720fc6b19fade0
      HOPPER_COUNTER_MAX_BYTES: 16384
      SBF_RELEASE_DIR: target/hopper/release/agave-v2.3.13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Require a clean source checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install Agave from a pinned official release archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/agave-${AGAVE_VERSION}.tar.bz2"
          install_dir="${RUNNER_TEMP}/agave-${AGAVE_VERSION}"
          archive_url="https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "${archive_url}" \
            --output "${archive}"
          test -s "${archive}"
          printf '%s  %s\n' "${AGAVE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          actual_sha=$(sha256sum "${archive}" | cut -d ' ' -f 1)
          mkdir "${install_dir}"
          tar -xjf "${archive}" -C "${install_dir}"
          agave_bin="${install_dir}/solana-release/bin"
          test -x "${agave_bin}/solana"
          test -x "${agave_bin}/cargo-build-sbf"
          {
            printf 'schema=hopper.agave-archive-provenance.v1\n'
            printf 'url=%s\n' "${archive_url}"
            printf 'expectedSha256Source=https://github.com/anza-xyz/agave/releases/expanded_assets/%s\n' "${AGAVE_VERSION}"
            printf 'expectedSha256=%s\n' "${AGAVE_ARCHIVE_SHA256}"
            printf 'actualSha256=%s\n' "${actual_sha}"
            printf 'sha256Verified=true\n'
            printf 'integrityMode=pinned-official-release-asset\n'
          } > "${RUNNER_TEMP}/agave-archive.provenance"
          printf '%s\n' "${agave_bin}" >> "${GITHUB_PATH}"
      - name: Toolchain versions
        run: |
          solana_version=$(solana --version)
          builder_version=$(cargo build-sbf --version | sed -n '1p')
          rust_version=$(rustc --version)
          printf '%s\n%s\n%s\n' "$solana_version" "$builder_version" "$rust_version"
          case "$solana_version" in *"solana-cli 2.3.13"*) ;; *) exit 1 ;; esac
          test "$builder_version" = "cargo-build-sbf 2.3.13"
          case "$rust_version" in "rustc 1.96.0 "*) ;; *) exit 1 ;; esac
      - name: Build tiny counter and enforce size budget
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-counter/Cargo.toml \
            -- --locked
          program=$(find target -type f -name hopper_counter.so -print -quit)
          if [ -z "${program}" ]; then
            echo "hopper_counter.so was not found under target/"
            find target -maxdepth 5 -type f -name '*.so' -print || true
            exit 1
          fi
          bytes=$(stat -c%s "${program}")
          echo "hopper-counter SBF artifact: ${program}"
          echo "hopper-counter SBF bytes: ${bytes}"
          if [ "${bytes}" -gt "${HOPPER_COUNTER_MAX_BYTES}" ]; then
            echo "hopper-counter exceeded ${HOPPER_COUNTER_MAX_BYTES} byte SBF budget"
            exit 1
          fi
      - name: Build vault SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-vault/Cargo.toml \
            -- --locked
      - name: Build bounded multisig SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-bounded-multisig/Cargo.toml \
            -- --locked
      - name: Build treasury SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-treasury/Cargo.toml \
            -- --locked
      - name: Build and test native CPI preflight and immediate abort
        run: |
          cargo build-sbf --manifest-path bench/checked-cpi/program/Cargo.toml -- --locked
          HOPPER_CHECKED_CPI_SBF="$PWD/target/deploy/hopper_checked_cpi_fixture.so" \
            cargo test -p hopper-framework-verifier --test checked_cpi_sbf --locked -- --ignored --nocapture
      - name: Test multisig and treasury asset execution
        env:
          HOPPER_TREASURY_SBF: ${{ github.workspace }}/target/deploy/hopper_treasury.so
          HOPPER_MULTISIG_SBF: ${{ github.workspace }}/target/deploy/hopper_bounded_multisig.so
        run: cargo test -p hopper-framework-verifier --test governance_sbf --locked -- --ignored --nocapture
      - name: Build escrow SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-escrow/Cargo.toml \
            -- --locked
      - name: Test funded escrow against canonical SPL Token
        env:
          HOPPER_ESCROW_SBF: target/deploy/hopper_escrow.so
        run: |
          test -f "$HOPPER_ESCROW_SBF"
          cargo test --manifest-path bench/framework-comparison/verifier/Cargo.toml \
            --test token_escrow_sbf --locked -- --ignored --nocapture
      - name: Build versioned-state (migration) SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-migration/Cargo.toml \
            -- --locked
      - name: Build orderbook SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-orderbook/Cargo.toml \
            -- --locked
      - name: Install Hopper CLI
        run: cargo install --path tools/hopper-cli --locked
      - name: Build, verify, and attest isolated Cicada SBF
        run: |
          test ! -e "${SBF_RELEASE_DIR}"
          mkdir -p "${SBF_RELEASE_DIR}"
          python3 scripts/attest-sbf-release.py \
            --package hopper-cicada \
            --program-manifest examples/hopper-cicada/Cargo.toml \
            --manifest "${SBF_RELEASE_DIR}/hopper-cicada.manifest.json" \
            --binary "${SBF_RELEASE_DIR}/sbf/hopper_cicada.so" \
            --build-tool cargo-build-sbf \
            --require-clean \
            --out "${SBF_RELEASE_DIR}/hopper-cicada.sbf-attestation.json"
      - name: Build Cicada hostile-route fixture SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-cicada-route-fixture/Cargo.toml \
            -- --locked
      - name: Build Cicada canonical-route fixture SBF
        run: |
          cargo build-sbf \
            --manifest-path examples/hopper-cicada-canonical-route-fixture/Cargo.toml \
            -- --locked
      - name: Stage and require every Cicada test program
        run: |
          mkdir -p target/deploy
          cp "${SBF_RELEASE_DIR}/sbf/hopper_cicada.so" target/deploy/hopper_cicada.so
          test -f target/deploy/hopper_cicada.so
          test -f target/deploy/hopper_cicada_route_fixture.so
          test -f target/deploy/hopper_cicada_canonical_route_fixture.so
      - name: Stage compatibility binaries for archival
        run: |
          mkdir -p "${SBF_RELEASE_DIR}/compat"
          for name in \
            hopper_counter \
            hopper_vault \
            hopper_quasar_port_20_min \
            hopper_escrow \
            hopper_migration \
            hopper_orderbook \
            hopper_cicada_route_fixture \
            hopper_cicada_canonical_route_fixture
          do
            test -f "target/deploy/${name}.so"
            cp "target/deploy/${name}.so" "${SBF_RELEASE_DIR}/compat/${name}.so"
          done
      - name: Test Cicada
        env:
          HOPPER_REQUIRE_CICADA_SBF: "1"
        run: cargo test -p hopper-cicada --locked
      - name: Test policy-gated scoped segments
        run: cargo test -p hopper-runtime --locked scoped_context_runtime_segments_preserve_write_policy
      - name: Deny Cicada policy escapes
        run: |
          cargo run --locked -p hopper-cli -- lint --project examples/hopper-cicada --deny-escapes
      - name: Deny Cicada whole-account mutation wrappers
        run: |
          if rg '\.(get_mut|load_mut|with_mut)\(' examples/hopper-cicada/src/lib.rs; then
            echo "Cicada shared state must mutate through policy-gated segment access"
            exit 1
          fi
      - name: Solana shape and SBF scan
        run: hopper solana-check --all --build-sbf
      - name: Finalize pinned Cicada and compile-only compatibility provenance
        run: |
          {
            printf 'schema=hopper.sbf-ci-provenance.v1\n'
            printf 'sourceCommit=%s\n' "$(git rev-parse HEAD)"
            printf 'githubRunId=%s\n' "${GITHUB_RUN_ID}"
            printf 'githubRunAttempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'githubWorkflowRef=%s\n' "${GITHUB_WORKFLOW_REF}"
            printf 'agaveCli=%s\n' "$(solana --version)"
            printf 'sbfBuilder=%s\n' "$(cargo build-sbf --version | sed -n '1p')"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'runtimeAgaveValidatorExecuted=false\n'
            printf 'cicadaCoverage=isolated-build+full-publish-check+sbf-harness\n'
            printf 'compatibilityProgramsCoverage=compile-only\n'
          } > "${SBF_RELEASE_DIR}/TOOLCHAIN.txt"
          cp "${RUNNER_TEMP}/agave-archive.provenance" "${SBF_RELEASE_DIR}/AGAVE_ARCHIVE_PROVENANCE.txt"
          (
            cd "${SBF_RELEASE_DIR}"
            sha256sum \
              AGAVE_ARCHIVE_PROVENANCE.txt \
              TOOLCHAIN.txt \
              hopper-cicada.manifest.json \
              hopper-cicada.sbf-attestation.json \
              hopper-cicada.sbf-attestation.logs/*.json \
              sbf/hopper_cicada.so \
              compat/*.so \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload pinned SBF release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-cicada-sbf-agave-v2.3.13
          if-no-files-found: error
          path: |
            target/hopper/release/agave-v2.3.13/sbf/hopper_cicada.so
            target/hopper/release/agave-v2.3.13/hopper-cicada.manifest.json
            target/hopper/release/agave-v2.3.13/hopper-cicada.sbf-attestation.json
            target/hopper/release/agave-v2.3.13/hopper-cicada.sbf-attestation.logs/*.json
            target/hopper/release/agave-v2.3.13/AGAVE_ARCHIVE_PROVENANCE.txt
            target/hopper/release/agave-v2.3.13/TOOLCHAIN.txt
            target/hopper/release/agave-v2.3.13/SHA256SUMS
            target/hopper/release/agave-v2.3.13/compat/*.so
          retention-days: 90

  sbf-agave-4-2-forward:
    name: SBF compatibility + gate Mollusk tests (Agave CLI 4.2.1, builder 4.1.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AGAVE_FORWARD_VERSION: v4.2.1
      AGAVE_ARCHIVE_SHA256: 7f35f92c15861263bc540c001466678d2da228149a107b51d5b65ce497603074
      CARGO_BUILD_SBF_VERSION: 4.1.0
      SBF_RELEASE_DIR: target/hopper/release/agave-v4.2.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Require a clean source checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install Agave from a pinned official release archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/agave-${AGAVE_FORWARD_VERSION}.tar.bz2"
          install_dir="${RUNNER_TEMP}/agave-${AGAVE_FORWARD_VERSION}"
          archive_url="https://github.com/anza-xyz/agave/releases/download/${AGAVE_FORWARD_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "${archive_url}" \
            --output "${archive}"
          test -s "${archive}"
          printf '%s  %s\n' "${AGAVE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          actual_sha=$(sha256sum "${archive}" | cut -d ' ' -f 1)
          mkdir "${install_dir}"
          tar -xjf "${archive}" -C "${install_dir}"
          agave_bin="${install_dir}/solana-release/bin"
          test -x "${agave_bin}/solana"
          {
            printf 'schema=hopper.agave-archive-provenance.v1\n'
            printf 'url=%s\n' "${archive_url}"
            printf 'expectedSha256Source=https://github.com/anza-xyz/agave/releases/expanded_assets/%s\n' "${AGAVE_FORWARD_VERSION}"
            printf 'expectedSha256=%s\n' "${AGAVE_ARCHIVE_SHA256}"
            printf 'actualSha256=%s\n' "${actual_sha}"
            printf 'sha256Verified=true\n'
            printf 'integrityMode=pinned-official-release-asset\n'
          } > "${RUNNER_TEMP}/agave-archive.provenance"
          printf '%s\n' "${agave_bin}" >> "${GITHUB_PATH}"
      # Agave 4.1+ no longer bundles the SBF SDK in the validator tarball.
      # Pin the independently released builder rather than accidentally using
      # whichever cargo-build-sbf happens to be first on PATH.
      - name: Install standalone forward SBF builder
        run: cargo install --locked cargo-build-sbf --version "${CARGO_BUILD_SBF_VERSION}" --force
      - name: Forward toolchain versions
        run: |
          solana_version=$(solana --version)
          builder_version=$("$HOME/.cargo/bin/cargo-build-sbf" --version | sed -n '1p')
          rust_version=$(rustc --version)
          printf '%s\n%s\n%s\n' "$solana_version" "$builder_version" "$rust_version"
          case "$solana_version" in *"solana-cli 4.2.1"*) ;; *) exit 1 ;; esac
          test "$builder_version" = "cargo-build-sbf ${CARGO_BUILD_SBF_VERSION}"
          case "$rust_version" in "rustc 1.96.0 "*) ;; *) exit 1 ;; esac
      - name: Require a fresh compile-only evidence directory
        run: |
          test ! -e "${SBF_RELEASE_DIR}"
          mkdir -p "${SBF_RELEASE_DIR}"
      - name: Compile migration and counter with the forward builder
        run: |
          "$HOME/.cargo/bin/cargo-build-sbf" \
            --manifest-path examples/hopper-migration/Cargo.toml \
            --sbf-out-dir "${SBF_RELEASE_DIR}/migration-sbpf-v0" \
            -- --locked
          "$HOME/.cargo/bin/cargo-build-sbf" \
            --arch v3 \
            --manifest-path examples/hopper-counter/Cargo.toml \
            --sbf-out-dir "${SBF_RELEASE_DIR}/counter-sbpf-v3" \
            -- --locked
      - name: Execute ambient gate regressions in Mollusk on SBF v0 and v3
        run: |
          for arch in v0 v3; do
            "$HOME/.cargo/bin/cargo-build-sbf" \
              --arch "$arch" \
              --manifest-path bench/runtime-gate/program/Cargo.toml \
              --sbf-out-dir "target/hopper/runtime-gate-$arch" \
              -- --locked
            HOPPER_GATE_SBF="$PWD/target/hopper/runtime-gate-$arch/hopper_runtime_gate_fixture.so" \
              cargo test -p hopper-framework-verifier --test ambient_gate_sbf --locked -- --ignored --nocapture
          done
      - name: Check PDA seed boundaries against the SDK on SBF v0 and v3
        run: |
          for arch in v0 v3; do
            "$HOME/.cargo/bin/cargo-build-sbf" \
              --arch "$arch" \
              --manifest-path bench/pda-boundaries/program/Cargo.toml \
              --sbf-out-dir "target/hopper/pda-boundaries-$arch" \
              -- --locked
            HOPPER_PDA_SBF="$PWD/target/hopper/pda-boundaries-$arch/hopper_pda_boundaries_fixture.so" \
              cargo test -p hopper-framework-verifier --test pda_boundaries_sbf --locked -- --ignored --nocapture
          done
      - name: Verify canonical bumps and mint plans on SBF v0 and v3
        run: |
          set -euo pipefail
          for arch in v0 v3; do
            for fixture in canonical-pda mint-plan; do
              "$HOME/.cargo/bin/cargo-build-sbf" \
                --tools-version v1.54 --arch "$arch" \
                --manifest-path "bench/$fixture/program/Cargo.toml" \
                --sbf-out-dir "${SBF_RELEASE_DIR}/$fixture-$arch" \
                -- --locked
            done
            HOPPER_CANONICAL_PDA_SBF="$PWD/${SBF_RELEASE_DIR}/canonical-pda-$arch/hopper_canonical_pda_fixture.so" \
              cargo test -p hopper-framework-verifier --test canonical_pda_sbf --locked -- --ignored --nocapture \
              2>&1 | tee "${SBF_RELEASE_DIR}/canonical-pda-$arch/tests.log"
            HOPPER_MINT_PLAN_SBF="$PWD/${SBF_RELEASE_DIR}/mint-plan-$arch/hopper_mint_plan_fixture.so" \
              cargo test -p hopper-framework-verifier --test mint_plan_sbf --locked -- --ignored --nocapture \
              2>&1 | tee "${SBF_RELEASE_DIR}/mint-plan-$arch/tests.log"
          done
      - name: Install Hopper CLI
        run: cargo install --path tools/hopper-cli --locked
      - name: Verify on-chain allowance cells on SBF v0 and v3
        run: |
          set -euo pipefail
          for arch in v0 v3; do
            "$HOME/.cargo/bin/cargo-build-sbf" \
              --tools-version v1.54 --arch "$arch" \
              --manifest-path examples/hopper-byte-allowance/Cargo.toml \
              --sbf-out-dir "${SBF_RELEASE_DIR}/byte-allowance-$arch" \
              -- --locked
            HOPPER_BYTE_ALLOWANCE_SBF="$PWD/${SBF_RELEASE_DIR}/byte-allowance-$arch/hopper_byte_allowance.so" \
              cargo test -p hopper-framework-verifier --test byte_allowance_sbf --locked -- --ignored --nocapture \
              2>&1 | tee "${SBF_RELEASE_DIR}/byte-allowance-$arch/tests.log"
          done
      - name: Verify named initialization and SOL custody on SBF v0 and v3
        run: |
          set -euo pipefail
          for arch in v0 v3; do
            "$HOME/.cargo/bin/cargo-build-sbf" \
              --tools-version v1.54 --arch "$arch" \
              --manifest-path examples/hopper-vault/Cargo.toml \
              --sbf-out-dir "${SBF_RELEASE_DIR}/named-vault-$arch" \
              -- --locked
            HOPPER_NAMED_VAULT_SBF="$PWD/${SBF_RELEASE_DIR}/named-vault-$arch/hopper_vault.so" \
              cargo test -p hopper-framework-verifier --test named_vault_sbf --locked -- --ignored --nocapture \
              2>&1 | tee "${SBF_RELEASE_DIR}/named-vault-$arch/tests.log"
          done
      - name: Verify segmented orderbook initialization and byte isolation
        run: |
          set -euo pipefail
          "$HOME/.cargo/bin/cargo-build-sbf" \
            --tools-version v1.54 --arch v0 \
            --manifest-path examples/hopper-orderbook/Cargo.toml \
            --sbf-out-dir "${SBF_RELEASE_DIR}/orderbook-v0" \
            -- --locked
          HOPPER_ORDERBOOK_SBF="$PWD/${SBF_RELEASE_DIR}/orderbook-v0/hopper_orderbook.so" \
            cargo test -p hopper-framework-verifier --test orderbook_sbf --locked -- --ignored --nocapture \
            2>&1 | tee "${SBF_RELEASE_DIR}/orderbook-v0/tests.log"
      - name: Build, verify, and attest isolated Cicada with the forward builder
        run: |
          python3 scripts/attest-sbf-release.py \
            --package hopper-cicada \
            --program-manifest examples/hopper-cicada/Cargo.toml \
            --manifest "${SBF_RELEASE_DIR}/hopper-cicada.manifest.json" \
            --binary "${SBF_RELEASE_DIR}/sbf/hopper_cicada.so" \
            --build-tool "$HOME/.cargo/bin/cargo-build-sbf" \
            --require-clean \
            --out "${SBF_RELEASE_DIR}/hopper-cicada.sbf-attestation.json"
          {
            printf 'schema=hopper.sbf-ci-provenance.v1\n'
            printf 'sourceCommit=%s\n' "$(git rev-parse HEAD)"
            printf 'githubRunId=%s\n' "${GITHUB_RUN_ID}"
            printf 'githubRunAttempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'githubWorkflowRef=%s\n' "${GITHUB_WORKFLOW_REF}"
            printf 'agaveCli=%s\n' "$(solana --version)"
            printf 'sbfBuilder=%s\n' "$("$HOME/.cargo/bin/cargo-build-sbf" --version | sed -n '1p')"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'coverageMode=compile-only\n'
            printf 'runtimeAgaveValidatorExecuted=false\n'
            printf 'ambientGateMolluskExecuted=true\n'
            printf 'ambientGateArch=sbpf-v0,sbpf-v3\n'
            printf 'pdaBoundariesMolluskExecuted=true\n'
            printf 'canonicalPdaAndMintPlanMolluskExecuted=sbpf-v0,sbpf-v3\n'
            printf 'migrationArch=sbpf-v0\n'
            printf 'counterArch=sbpf-v3\n'
            printf 'cicadaArch=sbpf-v0\n'
          } > "${SBF_RELEASE_DIR}/TOOLCHAIN.txt"
          cp "${RUNNER_TEMP}/agave-archive.provenance" "${SBF_RELEASE_DIR}/AGAVE_ARCHIVE_PROVENANCE.txt"
          (
            cd "${SBF_RELEASE_DIR}"
            sha256sum \
              AGAVE_ARCHIVE_PROVENANCE.txt \
              TOOLCHAIN.txt \
              hopper-cicada.manifest.json \
              hopper-cicada.sbf-attestation.json \
              hopper-cicada.sbf-attestation.logs/*.json \
              sbf/hopper_cicada.so \
              migration-sbpf-v0/hopper_migration.so \
              counter-sbpf-v3/hopper_counter.so \
              canonical-pda-v*/hopper_canonical_pda_fixture.so \
              canonical-pda-v*/tests.log \
              mint-plan-v*/hopper_mint_plan_fixture.so \
              mint-plan-v*/tests.log \
              byte-allowance-v*/hopper_byte_allowance.so \
              byte-allowance-v*/tests.log \
              named-vault-v*/hopper_vault.so \
              named-vault-v*/tests.log \
              orderbook-v0/hopper_orderbook.so \
              orderbook-v0/tests.log \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload Agave 4.2 forward SBF evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-cicada-sbf-agave-v4.2.1
          if-no-files-found: error
          path: |
            target/hopper/release/agave-v4.2.1/sbf/hopper_cicada.so
            target/hopper/release/agave-v4.2.1/hopper-cicada.manifest.json
            target/hopper/release/agave-v4.2.1/hopper-cicada.sbf-attestation.json
            target/hopper/release/agave-v4.2.1/hopper-cicada.sbf-attestation.logs/*.json
            target/hopper/release/agave-v4.2.1/AGAVE_ARCHIVE_PROVENANCE.txt
            target/hopper/release/agave-v4.2.1/TOOLCHAIN.txt
            target/hopper/release/agave-v4.2.1/SHA256SUMS
            target/hopper/release/agave-v4.2.1/migration-sbpf-v0/hopper_migration.so
            target/hopper/release/agave-v4.2.1/counter-sbpf-v3/hopper_counter.so
