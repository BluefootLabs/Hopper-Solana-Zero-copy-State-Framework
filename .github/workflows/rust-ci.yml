name: Rust release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # Pin to the channel in rust-toolchain.toml so fmt/clippy diagnostics are
      # deterministic (H-6). Keep this version in sync with that file.
      - name: Install Rust (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Assert pinned Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.96\.0 '
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  workspace-all-targets:
    name: workspace all-targets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Assert pinned Rust toolchain
        shell: bash
        run: rustc --version | grep -E '^rustc 1\.96\.0 '
      - name: Check workspace all targets
        run: cargo check --workspace --all-targets --locked

  workspace-tests:
    name: workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Assert pinned Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.96\.0 '
      - name: Run the complete host workspace suite
        run: cargo test --workspace --locked --no-fail-fast
      - name: Devnet RPC read retry boundaries
        run: python3 scripts/tests/test_devnet_rpc.py
      - name: Reject forged fixed-layout sizes during code generation
        run: python3 scripts/test-fixed-layout-rejections.py

  focused-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Assert pinned Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.96\.0 '
      - name: Run focused audit tests
        run: |
          cargo test -p hopper-systems --test trust_tests --locked
          cargo test -p hopper-bounded-multisig --locked
          cargo test -p hopper-lang --features proc-macros --test dynamic_account_integration --locked
          cargo test -p hopper-lang --features proc-macros --test remaining_accounts_context_integration --locked
          cargo test -p hopper-lang --features proc-macros --test token_2022_docs --locked
          # Grillo is the independent effect verifier: its fail-closed
          # guard rails (neighbor-cell VIOLATION, malformed-hex refusal,
          # parametric INCONCLUSIVE) must EXECUTE in CI, not merely
          # compile; an always-PASS regression is invisible to check/clippy.
          cargo test -p grillo-verifier --features cli --locked
          cargo test -p hopper-cli --locked verify::
          cargo test -p hopper-cli --locked cmd::fuzz::tests
          cargo test -p hopper-cli --test fuzz_adapter_process_e2e --locked
      - name: Verify manifest-derived Cicada fuzz plan
        run: |
          cargo run -p hopper-cli --locked -- compile --emit manifest --package hopper-cicada --out target/hopper/fuzz/cicada.manifest.json --force
          cargo run -p hopper-cli --locked -- fuzz check --program target/hopper/fuzz/cicada.manifest.json --plan fuzz/plans/hopper-cicada.plan.json
          cargo build -p hopper-cicada-fuzz-adapter --locked
          cargo run -p hopper-cli --locked -- fuzz run --program target/hopper/fuzz/cicada.manifest.json --plan fuzz/plans/hopper-cicada.plan.json --adapter target/debug/hopper-cicada-fuzz-adapter --require-invariant cicada-business-semantics --report target/hopper/fuzz/cicada-semantic-report.json
      - name: Upload Cicada semantic fuzz evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-cicada-semantic-fuzz
          if-no-files-found: error
          retention-days: 90
          path: target/hopper/fuzz/cicada-semantic-report.json
      - name: Check unsafe safety comments
        run: python3 scripts/check-unsafe-safety-comments.py

  publication-train:
    name: 29-crate publication train
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Assert pinned Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.96\.0 '
      - name: Validate topology, metadata, and packaged file sets
        run: |
          python3 scripts/check-publish-train.py --self-test
          python3 scripts/tests/test_release_provenance.py
          python3 scripts/check-publish-train.py --out target/hopper/release/publish-train.json
          archive_count=$(find target/package -maxdepth 1 -type f -name '*.crate' | wc -l)
          test "${archive_count}" -eq 29
      - name: Upload publication-train attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-publish-train
          if-no-files-found: error
          retention-days: 90
          path: |
            target/hopper/release/publish-train.json
            target/package/*.crate

  dependency-audit:
    name: RustSec dependency gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_TERM_COLOR: always
      RUSTSEC_DIR: target/hopper/release/rustsec
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust and cargo-audit
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Install and assert cargo-audit
        run: |
          rustc --version | grep -E '^rustc 1\.96\.0 '
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
          cargo-audit --version | grep -Fx "cargo-audit ${CARGO_AUDIT_VERSION}"
      - name: Fetch a fresh RustSec database and pin the run to its commit
        run: |
          set -euo pipefail
          mkdir -p "${RUSTSEC_DIR}"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "${RUSTSEC_DIR}/advisory-db"
          db_commit=$(git -C "${RUSTSEC_DIR}/advisory-db" rev-parse HEAD)
          db_commit_date=$(git -C "${RUSTSEC_DIR}/advisory-db" show -s --format=%cI HEAD)
          test -z "$(git -C "${RUSTSEC_DIR}/advisory-db" status --porcelain)"
          {
            printf 'schema=hopper.rustsec-provenance.v1\n'
            printf 'sourceCommit=%s\n' "${GITHUB_SHA}"
            printf 'cargoAuditVersion=%s\n' "$(cargo-audit --version)"
            printf 'advisoryDbRemote=https://github.com/RustSec/advisory-db.git\n'
            printf 'advisoryDbCommit=%s\n' "${db_commit}"
            printf 'advisoryDbCommitDate=%s\n' "${db_commit_date}"
            printf 'githubRunId=%s\n' "${GITHUB_RUN_ID}"
            printf 'githubRunAttempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'githubWorkflowRef=%s\n' "${GITHUB_WORKFLOW_REF}"
          } > "${RUSTSEC_DIR}/PROVENANCE.txt"
      - name: Audit the locked dependency graph without mutating the pinned database
        run: |
          set -euo pipefail
          set +e
          cargo audit \
            --db "${RUSTSEC_DIR}/advisory-db" \
            --no-fetch \
            --json \
            > "${RUSTSEC_DIR}/cargo-audit.json"
          audit_exit=$?
          set -e
          test -z "$(git -C "${RUSTSEC_DIR}/advisory-db" status --porcelain)"
          python3 -c 'import json, pathlib; json.loads(pathlib.Path("target/hopper/release/rustsec/cargo-audit.json").read_text(encoding="utf-8"))'
          {
            printf 'cargoAuditExitCode=%s\n' "${audit_exit}"
            printf 'reportSha256=%s\n' "$(sha256sum "${RUSTSEC_DIR}/cargo-audit.json" | cut -d ' ' -f 1)"
          } >> "${RUSTSEC_DIR}/PROVENANCE.txt"
          exit "${audit_exit}"
      - name: Upload RustSec report and database provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-rustsec-audit
          if-no-files-found: error
          retention-days: 90
          path: |
            target/hopper/release/rustsec/PROVENANCE.txt
            target/hopper/release/rustsec/cargo-audit.json

  audit-readiness-status:
    name: External audit readiness status (nonblocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Report readiness without closing or gating on the external audit
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.96\.0 '
          mkdir -p target/hopper/release/audit-readiness
          set +e
          cargo run --locked -p hopper-cli -- audit-check --json \
            > target/hopper/release/audit-readiness/status.json
          audit_exit=$?
          set -e
          {
            printf 'mode=non-strict-status-only\n'
            printf 'expectedExitCode=0\n'
            printf 'actualExitCode=%s\n' "${audit_exit}"
          } > target/hopper/release/audit-readiness/COMMAND_STATUS.txt
          test "${audit_exit}" -eq 0
          python3 -c 'import json, pathlib; p=pathlib.Path("target/hopper/release/audit-readiness/status.json"); d=json.loads(p.read_text(encoding="utf-8")); assert d.get("ready") is False, "external audit unexpectedly reported ready"; findings=d.get("findings"); assert isinstance(findings, list), "findings is not a list"; assert any(f.get("id") == "external-audit" and f.get("level") == "blocker" for f in findings), "known external-audit blocker missing"'
      - name: Upload audit-readiness status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-audit-readiness-status
          if-no-files-found: error
          retention-days: 90
          path: |
            target/hopper/release/audit-readiness/status.json
            target/hopper/release/audit-readiness/COMMAND_STATUS.txt

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: nightly-2026-08-01
      - name: Install stable Rust for cargo-fuzz
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Install cargo-fuzz
        run: |
          rustc +1.96.0 --version | grep -E '^rustc 1\.96\.0 '
          cargo +1.96.0 install cargo-fuzz --version 0.13.2 --locked
          cargo +1.96.0 fuzz --version | grep -F '0.13.2'
          rustup toolchain list | grep -F 'nightly-2026-08-01'
      - name: Run fuzz smoke targets
        working-directory: fuzz
        run: |
          cargo +nightly-2026-08-01 fuzz run fuzz_instruction_frame -- -max_total_time=15 -timeout=5
          cargo +nightly-2026-08-01 fuzz run fuzz_decode_header -- -max_total_time=15 -timeout=5
          cargo +nightly-2026-08-01 fuzz run fuzz_decode_segments -- -max_total_time=15 -timeout=5
          cargo +nightly-2026-08-01 fuzz run fuzz_pod_overlay -- -max_total_time=15 -timeout=5
          # P0: AccountView::load unsafe boundary (discriminator + version + layout fingerprint + alignment)
          cargo +nightly-2026-08-01 fuzz run fuzz_account_view_load -- -max_total_time=15 -timeout=5

  kani-runtime-proofs:
    name: Kani runtime proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Install Kani
        run: |
          rustc --version | grep -E '^rustc 1\.96\.0 '
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version | grep -F '0.67.0'
      - name: Run runtime Kani proofs
        run: sh ./scripts/kani-runtime-tail.sh

  kani-native-rawinput-proofs:
    name: Kani native raw-input proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Install Kani
        run: |
          rustc --version | grep -E '^rustc 1\.96\.0 '
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version | grep -F '0.67.0'
      - name: Run native raw-input Kani proofs
        run: sh ./scripts/kani-native-rawinput.sh

  kani-spl-layout-proofs:
    name: Kani SPL/System CPI layout proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e
        with:
          toolchain: 1.96.0
      - name: Install Kani
        run: |
          rustc --version | grep -E '^rustc 1\.96\.0 '
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version | grep -F '0.67.0'
      - name: Run SPL/System CPI layout Kani proofs
        run: sh ./scripts/kani-spl-layouts.sh
