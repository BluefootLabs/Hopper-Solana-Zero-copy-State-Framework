name: Rust release gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      # Pin to the channel in rust-toolchain.toml so fmt/clippy diagnostics are
      # deterministic (H-6). Keep this version in sync with that file.
      - name: Install Rust (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  workspace-all-targets:
    name: workspace all-targets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace all targets
        run: cargo check --workspace --all-targets --locked

  focused-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run focused audit tests
        run: |
          cargo test -p hopper-systems --test trust_tests --locked
          cargo test -p hopper-quasar-port-20-min --locked
          cargo test -p hopper-lang --features proc-macros --test dynamic_account_integration --locked
          cargo test -p hopper-lang --features proc-macros --test remaining_accounts_context_integration --locked
      - name: Check unsafe safety comments
        run: python3 scripts/check-unsafe-safety-comments.py

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install stable Rust for cargo-fuzz
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked
      - name: Run fuzz smoke targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_instruction_frame -- -max_total_time=15 -timeout=5
          cargo +nightly fuzz run fuzz_decode_header -- -max_total_time=15 -timeout=5
          cargo +nightly fuzz run fuzz_decode_segments -- -max_total_time=15 -timeout=5
          cargo +nightly fuzz run fuzz_pod_overlay -- -max_total_time=15 -timeout=5
          # P0: AccountView::load unsafe boundary (discriminator + version + layout fingerprint + alignment)
          cargo +nightly fuzz run fuzz_account_view_load -- -max_total_time=15 -timeout=5

  kani-runtime-proofs:
    name: Kani runtime proofs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run runtime Kani proofs
        run: sh ./scripts/kani-runtime-tail.sh

  kani-native-rawinput-proofs:
    name: Kani native raw-input proofs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run native raw-input Kani proofs
        run: sh ./scripts/kani-native-rawinput.sh
