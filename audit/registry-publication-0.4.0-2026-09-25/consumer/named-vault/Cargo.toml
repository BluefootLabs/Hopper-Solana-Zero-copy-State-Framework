[workspace]
[package]
name = "hopper-vault"
version = "0.4.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
hopper = { package = "hopper-lang", version = "=0.4.0", features = ["proc-macros"] }
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }
[profile.release]
overflow-checks = true
# Ecosystem-standard on-chain size/perf profile, matching `anchor init`, Quasar,
# and the Solana performance guide. `codegen-units = 1` is a free win (better
# cross-unit optimization, no CU cost). `lto = "fat"` only takes effect for a
# program crate whose `[lib] crate-type` is `["cdylib"]` alone: with an rlib in
# the list, cargo drops `-C lto` for the cdylib and the flag is a no-op. Measured
# 2026-09-19 (cargo-build-sbf 4.1.0, platform-tools v1.54): hopper-vault
# 22,288 -> 15,264 bytes and hopper-sentinel 71,168 -> 63,688 bytes from that
# one change. Program crates keep `"lib"` only when a `tests/` integration test
# imports them. opt-level stays at 3 to preserve the measured CU story;
# `opt-level = "z"/"s"` would trade roughly 50% more CU for ~5% size and is
# deliberately not taken.
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The reviewed substrate opts back out: its arithmetic is explicitly
# checked/widened where it matters and its parsing loops are bounds-guarded
# by construction, so the flag only adds flat CU there. User program crates
# and the domain crates
# keep full checking.
[profile.release.package.hopper-native]
overflow-checks = false
[profile.release.package.hopper-runtime]
overflow-checks = false
[profile.release.package.hopper-systems]
overflow-checks = false
[profile.release.package.hopper-lang]
overflow-checks = false
