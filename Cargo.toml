[workspace]
# Framework-internal crates live in this workspace, matching the
# "One repo per coherent product" model. The former
# sister repos were folded back with subtree history preserved.
members = [
    ".",
    "crates/hopper-native",
    "crates/hopper-runtime",
    "crates/hopper-core",
    "crates/hopper-macros",
    "crates/hopper-macros-proc",
    "crates/hopper-system",
    "crates/hopper-schema",
    "crates/hopper-solana",
    "crates/hopper-builtins",
    "crates/hopper-spl/hopper-token",
    "crates/hopper-spl/hopper-token-2022",
    "crates/hopper-spl/hopper-associated-token",
    "crates/hopper-spl/hopper-metaplex",
    "crates/hopper-finance",
    "crates/hopper-lending",
    "crates/hopper-staking",
    "crates/hopper-vesting",
    "crates/hopper-distribute",
    "crates/hopper-multisig",
    "crates/hopper-memo",
    "crates/hopper-anchor",
    "crates/hopper-svm",
    "examples/hopper-counter",
    "examples/hopper-compact-vault",
    "examples/hopper-smoke",
    "examples/hopper-sentinel",
    "examples/hopper-cicada",
    "examples/hopper-cicada-route-fixture",
    "examples/hopper-vault",
    "examples/hopper-parity-vault",
    "examples/hopper-router",
    "examples/hopper-escrow",
    "examples/hopper-showcase",
    "examples/hopper-treasury",
    "examples/hopper-registry",
    "examples/hopper-migration",
    "examples/hopper-virtual-state",
    "examples/hopper-orderbook",
    "examples/hopper-token-2022-ata",
    "examples/hopper-token-2022-vault",
    "examples/hopper-token-2022-transfer-hook",
    "examples/hopper-nft-mint",
    "examples/hopper-proc-vault",
    "examples/hopper-policy-vault",
    "examples/hopper-devnet-audit",
    "examples/hopper-external-oracle",
    "examples/hopper-argus-guard",
    "examples/hopper-tail-lab",
    "examples/hopper-stablecoin-memo-pay",
    "examples/hopper-styx-ferry",
    "examples/quasar-port-20-min",
    "examples/cross-program-read/program-a",
    "examples/cross-program-read/program-b",
    "examples/cross-program-read/runner",
    "tests/hopper-trybuild",
    "crates/hopper-manager",
    "crates/hopper-sdk",
    "crates/hopper-test",
    "crates/grillo-manifest",
    "crates/grillo-verifier",
    "crates/hopper-topology",
    "tools/hopper-cli",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[workspace.dependencies]
hopper-native = { path = "crates/hopper-native", version = "0.3.0", default-features = false }
hopper-runtime = { path = "crates/hopper-runtime", version = "0.3.0", default-features = false }
hopper-core = { path = "crates/hopper-core", package = "hopper-systems", version = "0.3.0", default-features = false }
hopper-macros = { path = "crates/hopper-macros", version = "0.3.0", default-features = false }
hopper-macros-proc = { path = "crates/hopper-macros-proc", package = "hopper-derive", version = "0.3.0" }
hopper = { path = ".", package = "hopper-lang", version = "0.3.0" }
hopper-system = { path = "crates/hopper-system", version = "0.3.0", default-features = false }
hopper-schema = { path = "crates/hopper-schema", version = "0.3.0", default-features = false }
hopper-solana = { path = "crates/hopper-solana", version = "0.3.0", default-features = false }
hopper-token = { path = "crates/hopper-spl/hopper-token", version = "0.3.0", default-features = false }
hopper-token-2022 = { path = "crates/hopper-spl/hopper-token-2022", version = "0.3.0", default-features = false }
hopper-associated-token = { path = "crates/hopper-spl/hopper-associated-token", version = "0.3.0", default-features = false }
hopper-metaplex = { path = "crates/hopper-spl/hopper-metaplex", version = "0.3.0", default-features = false }
hopper-finance = { path = "crates/hopper-finance", version = "0.3.0" }
hopper-lending = { path = "crates/hopper-lending", version = "0.3.0" }
hopper-staking = { path = "crates/hopper-staking", version = "0.3.0" }
hopper-vesting = { path = "crates/hopper-vesting", version = "0.3.0" }
hopper-distribute = { path = "crates/hopper-distribute", version = "0.3.0" }
hopper-multisig = { path = "crates/hopper-multisig", version = "0.3.0" }
hopper-memo = { path = "crates/hopper-memo", version = "0.3.0", default-features = false }
hopper-anchor = { path = "crates/hopper-anchor", version = "0.3.0" }
hopper-svm = { path = "crates/hopper-svm", version = "0.3.0" }
hopper-manager = { path = "crates/hopper-manager", version = "0.3.0" }
hopper-sdk = { path = "crates/hopper-sdk", version = "0.3.0" }

[package]
name = "hopper-lang"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Fast zero-copy Solana framework with a simple account facade, typed state contracts, layout evolution, and systems-mode escape hatches. Built on Hopper Native. no_std, no_alloc."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-lang/0.3.0"
readme = "README.md"
keywords = ["solana", "zero-copy", "framework", "state", "no-std"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper"

[dependencies]
hopper-runtime = { workspace = true }
hopper-core = { workspace = true }
hopper-system = { workspace = true }
hopper-token = { workspace = true }
hopper-token-2022 = { workspace = true }
hopper-associated-token = { workspace = true }
hopper-memo = { workspace = true, default-features = false }
hopper-metaplex = { workspace = true, optional = true }
hopper-finance = { workspace = true, optional = true }
hopper-lending = { workspace = true, optional = true }
hopper-staking = { workspace = true, optional = true }
hopper-vesting = { workspace = true, optional = true }
hopper-distribute = { workspace = true, optional = true }
hopper-multisig = { workspace = true, optional = true }
hopper-anchor = { workspace = true, optional = true }
hopper-macros = { workspace = true }
hopper-schema = { path = "crates/hopper-schema", version = "0.3.0", default-features = false }
hopper-solana = { path = "crates/hopper-solana", version = "0.3.0", default-features = false }
hopper-macros-proc = { workspace = true, optional = true }
hopper-builtins = { path = "crates/hopper-builtins", version = "0.3.0", optional = true }

[dev-dependencies]
# Host execution harness so integration tests can bind proc-macro
# contexts against real AccountView memory (BLD-I24 strict-writes
# declared-vs-published-vs-enforced consistency test).
hopper-svm = { workspace = true }
# Per-thread borrow registry for the root test binaries (see the same
# dev-dep in crates/hopper-core/Cargo.toml for the full rationale):
# parallel test threads must not share the process-global registry, or
# unrelated tests reusing a fake address can spuriously collide into
# `AccountBorrowFailed`. Dev-only; `cargo build` / SBF never see it.
hopper-runtime = { workspace = true, features = ["thread-local-registry"] }
trybuild = "1"

[features]
default = []
framework = []
systems = ["advanced", "collections"]
proc-macros = ["hopper-macros-proc", "receipt"]

# Metaplex Token Metadata builders (NFT mint, master edition, metadata
# update). Optional because not every Hopper program touches Metaplex
# and the crate adds compile time; opt in with `--features metaplex`.
metaplex = ["dep:hopper-metaplex"]

# OPT-OUT of the ambient write gate on the public raw AccountView
# surfaces, for raw-tier programs that never bind a `strict_writes`
# context (the strict codegen const-asserts the guard, so combining the
# two is a compile error). See hopper-runtime's feature of the same name.
unguarded-raw-surfaces = ["hopper-runtime/unguarded-raw-surfaces"]

# Program-wide tuned memory intrinsics (I18): overrides the C
# `memcmp`/`bcmp`/`memcpy`/`memset` symbols on the SBF target with an
# inline-below-32-bytes / syscall-above dispatch. Optional and off by
# default until the duplicate-symbol smoke phase lands; opt in with
# `--features builtins`.
builtins = ["dep:hopper-builtins"]
finance = ["dep:hopper-finance"]
lending = ["dep:hopper-lending"]
staking = ["dep:hopper-staking"]
vesting = ["dep:hopper-vesting"]
distribute = ["dep:hopper-distribute"]
multisig = ["dep:hopper-multisig"]
anchor-interop = ["dep:hopper-anchor"]
legacy-token-instructions = [
    "hopper-token/legacy-token-instructions",
    "hopper-solana/legacy-token-instructions",
]

# Advanced subsystems (forwarded to hopper-core)
advanced = ["hopper-core/advanced"]
frame = ["hopper-core/frame"]
receipt = ["hopper-core/receipt"]
policy = ["hopper-core/policy"]
graph = ["hopper-core/graph"]
migrate = ["hopper-core/migrate"]
virtual-state = ["hopper-core/virtual-state"]
diff = ["hopper-core/diff"]
explain = ["hopper-core/explain"]
collections = ["hopper-core/collections"]

cu-trace = ["hopper-runtime/cu-trace"]
# Opt-in instruction touch maps (innovation I7): Context::for_each_touch
# yields every distinct (account, offset, size, R/W) range an instruction
# touched, from the segment registry's append-only log.
touch-map = ["hopper-runtime/touch-map"]

# Opt-in SIMD-0321 two-argument fast entrypoint (r2 instruction-data
# pointer). Off by default: the SIMD's feature gate is not yet activated
# on public clusters, so `hopper::fast_entrypoint!` compiles to the
# standard scanning entrypoint unless this feature is enabled.
simd-0321 = ["hopper-runtime/simd-0321"]
# SIMD-0449 pre-computed account-pointer table (implies simd-0321).
# Readiness only: the SIMD's runtime feature gate has no assigned
# pubkey and no cluster serializes the table yet — enabling this today
# ships an entrypoint that reads garbage. The scanning path stays the
# default; `hopper feature-gate` detection lands with the pubkey.
simd-0449 = ["hopper-runtime/simd-0449", "simd-0321"]

# Opt-in sBPF v3 / SIMD-0178 static syscalls. SIMD-0178 replaces
# relocation-based syscall symbols with murmur32-hashed static calls;
# this flag routes Hopper's syscall decls (hopper-native + hopper-runtime)
# through the static-call ABI. Off by default so the standard v0..v2 build
# is byte-identical; enable it (with an sbpfv3 target) for v3 readiness.
static-syscalls = ["hopper-runtime/static-syscalls"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frame", "receipt", "policy", "graph", "migrate", "virtual-state", "diff", "explain", "advanced", "collections", "framework", "systems"))',
] }


# Deny silent integer wrap on-chain: without this, release builds (the
# only kind that reach a cluster) compile native `+`/`-`/`*` to wrapping
# arithmetic — the classic balance-overflow exploit shape. With it, any
# unchecked arithmetic that overflows aborts the transaction instead of
# corrupting state. Hopper's hot paths already use explicit checked or
# wire-type arithmetic, so the measured CU cost on the parity vault is
# recorded in BENCHMARKS.md alongside this flag.
[profile.release]
overflow-checks = true
# Ecosystem-standard on-chain size/perf profile, matching `anchor init`, Quasar,
# and the Solana performance guide. `codegen-units = 1` is the real free win
# (better cross-unit optimization, no CU cost). `lto = "fat"` is conventional but
# a near-no-op under `cargo build-sbf`: LLD already runs `--gc-sections`, and
# `core` ships as a prebuilt bitcode-free sysroot rlib LTO cannot reach. opt-level
# stays at 3 to preserve the measured CU story; `opt-level = "z"/"s"` would trade
# roughly 50% more CU for ~5% size and is deliberately not taken.
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The audited substrate opts back out: its arithmetic is explicitly
# checked/widened where it matters and its parsing loops are bounds-guarded
# by construction, so the flag only adds flat CU there. User program crates
# and the domain crates
# keep full checking.
[profile.release.package.hopper-native]
overflow-checks = false
[profile.release.package.hopper-runtime]
overflow-checks = false
[profile.release.package.hopper-systems]
overflow-checks = false
[profile.release.package.hopper-lang]
overflow-checks = false
