schema = "hopper.publish-train.v1"
default_version = "0.4.0"

# This is the machine-readable crates.io publication order.  The validation
# script rejects missing public workspace packages, non-public packages, and
# any normal/build path dependency that points forward in this list.
packages = [
  "grillo-manifest",
  "hopper-builtins",
  "hopper-derive",
  "hopper-native",
  "hopper-topology",
  "hopper-runtime",
  "hopper-anchor",
  "hopper-system",
  "hopper-systems",
  "hopper-token",
  "hopper-distribute",
  "hopper-lending",
  "hopper-memo",
  "hopper-metaplex",
  "hopper-multisig",
  "hopper-staking",
  "hopper-svm",
  "hopper-vesting",
  "hopper-finance",
  "hopper-schema",
  "hopper-macros",
  "hopper-solana",
  "hopper-associated-token",
  "hopper-token-2022",
  "hopper-manager",
  "hopper-sdk",
  "hopper-lang",
  "grillo-verifier",
  "hopper-cli",
]

[version_overrides]
hopper-native = "0.4.1"
hopper-runtime = "0.4.1"
grillo-manifest = "0.1.0"
grillo-verifier = "0.1.0"
hopper-topology = "0.1.0"
