[package]
name = "hopper-native"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Hopper's sovereign raw backend for Solana. Zero-copy account access, direct syscall layer, CPI infrastructure, PDA helpers, and entrypoint glue. no_std, no_alloc, no external runtime dependencies."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-native/0.3.0"
readme = "README.md"
keywords = ["solana", "zero-copy", "runtime", "no-std", "syscall"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper_native"

[features]
default = ["cpi", "legacy-projectable"]
cpi = []
copy = []
cu-trace = []
# Opt-in for `solana-define-syscall`'s `unstable-static-syscalls`.
# Saves 1-3 CU per syscall by replacing dynamic dispatch with direct
# calls. Off by default until the upstream feature stabilizes.
static-syscalls = []
# Opt-in for the SIMD-0321 two-argument entrypoint (`r2` carries a
# direct instruction-data pointer). The SIMD's feature gate
# (5xXZc66h4UdB6Yq7FzdBxBiRAFMMScMLwHxk2QZDaNZL) is ACTIVATED on all
# three public clusters (mainnet-beta 2026-04-01), so builds may enable
# this for any cluster target; the r2 null-check still falls back to the
# scanning parse defensively. Off by default by MEASURED choice
# (2026-07-21): post-fusion A/Bs are CU-neutral (+/- 2) for ~368 B of
# dual-path text; the feature is the base of the simd-0449 table path.
# Without it `hopper_fast_entrypoint!` compiles to the scanning
# entrypoint.
simd-0321 = []
# Opt-in for the SIMD-0449 pre-computed account-pointer table: the
# runtime appends a pre-deduplicated `[u64; n]` array of canonical
# account-record pointers after the instruction tail, making account
# resolution O(1) — no stride walk, no duplicate resolution. Requires
# `simd-0321` (the table is located relative to the r2 instruction-data
# pointer). Runtime gate: ptr9umikaeAS7ZBBp2fsfRhie16F1V2jCKA2y6gXNAK
# (rekeyed 2026-04-15, agave PR #11934; the original ptrXWLk… gate is
# dead). Activated on testnet + devnet, pending mainnet-beta — enable
# only for clusters where `hopper feature-gate` reports it active;
# elsewhere the table is absent and this path reads garbage. Off by
# default, scanning stays the default path.
simd-0449 = ["simd-0321"]
# `legacy-projectable` exposes the `Projectable` / `SafeProjectable`
# cross-program lens traits. The Hopper Safety Audit asked these be
# gated behind a feature and marked Tier-C so new code reaches for
# `Pod`-bounded helpers (`lens::read_field_pod`, `ZeroCopy`). Default
# on for backward compatibility; programs that never use the legacy
# cross-program projection path can disable it for a leaner surface.
legacy-projectable = []

[dependencies]

[lints]
workspace = true
