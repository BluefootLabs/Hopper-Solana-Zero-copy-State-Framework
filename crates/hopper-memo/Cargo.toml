[package]
name = "hopper-memo"
version = "0.4.0"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Hopper-owned SPL Memo program builder. Thin, no_std CPI helper for the SPL Memo (and legacy v1 Memo) programs."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-memo/0.4.0"
readme = "README.md"
keywords = ["solana", "memo", "spl", "cpi", "hopper"]
categories = ["no-std"]

[lib]
name = "hopper_memo"

[dependencies]
hopper-runtime = { workspace = true }

[features]
default = []

[lints]
workspace = true
