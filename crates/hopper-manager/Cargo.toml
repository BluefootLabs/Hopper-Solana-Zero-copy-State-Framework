[package]
name = "hopper-manager"
version = "0.4.0"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Schema-driven inspector for Hopper programs that renders reports from runtime, layout, and schema metadata."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-manager/0.4.0"
readme = "README.md"
keywords = ["solana", "hopper", "inspector", "schema", "zero-copy"]
categories = ["command-line-utilities"]

[lib]
name = "hopper_manager"

[dependencies]
hopper-schema = { workspace = true, features = ["receipt", "policy"] }

[lints]
workspace = true
