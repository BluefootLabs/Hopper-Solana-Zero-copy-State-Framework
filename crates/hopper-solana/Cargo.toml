[package]
name = "hopper-solana"
version = "0.4.1"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Solana integration layer for Hopper. SPL Token/Mint zero-copy readers, Token-2022 screening, CPI guards, token account helpers."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-solana/0.4.1"
readme = "README.md"
keywords = ["solana", "zero-copy", "spl-token", "cpi", "hopper-native"]
categories = ["no-std"]

[lib]
name = "hopper_solana"

[lints]
workspace = true

[dependencies]
hopper-core = { workspace = true }
hopper-runtime = { workspace = true }
hopper-system = { path = "../hopper-system", version = "0.4.0", default-features = false }
hopper-token = { workspace = true, default-features = false }

[dev-dependencies]
hopper-native = { workspace = true }
hopper-runtime = { workspace = true, features = ["thread-local-registry"] }

[features]
default = []
legacy-token-instructions = ["hopper-token/legacy-token-instructions"]
# Opt-in remaining-compute syscall. Its feature account was absent on all three
# public clusters in the 2026-09-26 finalized RPC capture. Enable only for a
# target verified to support it; host tests do not establish cluster support.
remaining-compute-units-syscall = ["hopper-runtime/remaining-compute-units-syscall"]
