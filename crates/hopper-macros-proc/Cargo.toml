[package]
name = "hopper-derive"
version = "0.3.1"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Proc macro layer for Hopper. Generates account layouts, typed context accessors, instruction dispatchers, schema metadata, and CPI builders."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-derive/0.3.1"
readme = "README.md"
keywords = ["solana", "zero-copy", "proc-macro", "codegen", "hopper"]
categories = ["no-std", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
sha2 = "0.10"
serde_json = "1"
# Host-only expansion, compatible with the older SBF toolchain's host Rust.
bs58 = "0.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Differential oracle; the modern SDK is not a proc-macro build dependency.
solana-address = { version = "2.6.1", features = ["curve25519", "decode"] }

[lints]
workspace = true
