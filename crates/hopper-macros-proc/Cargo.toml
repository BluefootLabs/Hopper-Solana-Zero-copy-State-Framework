[package]
name = "hopper-derive"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Proc macro layer for Hopper. Generates account layouts, typed context accessors, instruction dispatchers, schema metadata, and CPI builders."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-derive/0.2.1"
readme = "README.md"
keywords = ["solana", "zero-copy", "proc-macro", "codegen", "hopper"]
categories = ["no-std", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
sha2 = "0.10"
serde_json = "1"

[lints]
workspace = true
