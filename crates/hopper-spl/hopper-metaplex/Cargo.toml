[package]
name = "hopper-metaplex"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Hopper-owned Metaplex Token Metadata program builders, PDA helpers, and account read helpers. Powers the metadata::* / master_edition::* field keywords on #[derive(Accounts)] and #[hopper::context]."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-metaplex/0.3.0"
readme = "README.md"
keywords = ["solana", "metaplex", "nft", "zero-copy", "no-std"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper_metaplex"

[features]
default = []

[dependencies]
hopper-runtime = { workspace = true }

[lints]
workspace = true
