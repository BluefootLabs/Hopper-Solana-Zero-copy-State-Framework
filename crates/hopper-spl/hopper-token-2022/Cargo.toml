[package]
name = "hopper-token-2022"
version = "0.4.0"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Hopper-owned Token-2022 builder and screening surface. Thin, no_std instruction builders over Hopper Runtime."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-token-2022/0.4.0"
readme = "README.md"
keywords = ["solana", "token-2022", "cpi", "zero-copy", "hopper"]
categories = ["no-std"]

[lib]
name = "hopper_token_2022"

[dependencies]
hopper-runtime = { workspace = true }
hopper-solana = { workspace = true }

[features]
default = []

[dev-dependencies]
spl-token-2022-interface = "=3.1.1"
solana-pubkey = "=4.2.1"

[lints]
workspace = true
