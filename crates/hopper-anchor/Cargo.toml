[package]
name = "hopper-anchor"
version = "0.4.0"
publish = ["crates-io"]
edition = "2021"
license = "Apache-2.0"
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Anchor framework interoperability for Hopper. Compute and check Anchor discriminators and expose discriminator-checked body slices of Anchor-created accounts."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-anchor/0.4.0"
readme = "README.md"
keywords = ["solana", "zero-copy", "anchor", "interop", "hopper-native"]
categories = ["no-std"]

[lib]
name = "hopper_anchor"

[dependencies]
hopper-runtime = { workspace = true }

[features]
default = []
