[package]
name = "hopper-runtime"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Canonical low-level runtime surface for Hopper programs: direct account memory, validation, borrow guards, CPI, and zero-copy state access."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-runtime/0.3.0"
readme = "README.md"
keywords = ["solana", "zero-copy", "runtime", "no-std", "framework"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper_runtime"

[features]
default = []

cu-trace = ["hopper-native/cu-trace"]
# Opt-in instruction touch maps: the segment borrow registry keeps an
# append-only, deduplicated log of every (account, offset, size, R/W)
# range the instruction touches, readable via `Context::touch_map()`.
# Off by default so the hot path pays nothing.
touch-map = []
# Opt-in SIMD-0321 two-argument fast entrypoint. See hopper-native's
# feature of the same name; without it `hopper_fast_entrypoint!` is an
# alias for the standard scanning entrypoint.
simd-0321 = ["hopper-native/simd-0321"]
# SIMD-0449 pre-computed account-pointer table (implies simd-0321; see
# hopper-native's feature docs — readiness only, no cluster activates
# the SIMD yet).
simd-0449 = ["hopper-native/simd-0449", "simd-0321"]
cpi = []
copy = []
# OPT-OUT of the ambient write gate on the PUBLIC raw AccountView
# surfaces (raw whole-account borrows, direct segment access outside a
# Context, resize/close transitions). The guard is ON by default; this
# feature exists for raw-tier programs that never bind a `strict_writes`
# context and want the ~1.7 KiB gate-check code provably unlinked.
# Soundness fence, both tiers: `strict_writes` codegen const-asserts the
# guard (compile error), and hand-rolled installs of a data-declaring
# policy are refused at install time with AMBIENT_GATE_UNGUARDED_BUILD —
# never a silent bypass on any tier.
unguarded-raw-surfaces = []
# Opt-in sBPF v3 / SIMD-0178 static syscalls. Forwards to hopper-native so the
# `hopper_native::define_syscall!` invocations in `syscalls.rs` switch from the
# relocation-based `extern "C"` decl to the murmur32-hashed static-call ABI.
# Default-off: the standard v0..v2 build is unchanged.
static-syscalls = ["hopper-native/static-syscalls"]
legacy-token-instructions = []
# Per-thread host borrow registry (requires std). Downstream crates whose
# test binaries run many tests in parallel enable this in dev-dependencies
# so independent tests on different threads cannot cross-talk through the
# process-global registry (same fake address in two tests would otherwise
# collide and spuriously return AccountBorrowFailed). Semantically an
# invocation runs on one thread, so per-thread IS the invocation scope.
# Never enabled for SBF (single-threaded, separate impl) or by default.
thread-local-registry = []
crypto-curve = []
crypto-poseidon = []
crypto-bn254 = []
crypto-big-mod-exp = []

[dependencies]
hopper-native = { workspace = true, default-features = false, features = ["cpi"] }

[dev-dependencies]
# Property-based testing for the segment-borrow disjointness invariant.
# Host-only (`cargo test`); never compiled into the no_std SBF build.
proptest = "1"

[lints]
workspace = true
