[package]
name = "hopper-runtime"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Canonical low-level runtime surface for Hopper programs: direct account memory, validation, borrow guards, CPI, and zero-copy state access."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-runtime/0.2.1"
readme = "README.md"
keywords = ["solana", "zero-copy", "runtime", "no-std", "framework"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper_runtime"

[features]
default = []

# Compatibility aliases retained so downstream crates do not need an immediate
# Cargo.toml migration. They no longer select alternate backends: Hopper Runtime
# has one production account-memory path.
hopper-native-backend = []
legacy-pinocchio-compat = []
solana-program-backend = []

cu-trace = ["hopper-native/cu-trace"]
cpi = []
copy = []
legacy-token-instructions = []
crypto-curve = []
crypto-poseidon = []
crypto-bn254 = []
crypto-big-mod-exp = []

[dependencies]
hopper-native = { workspace = true, default-features = false, features = ["cpi", "bytemuck"] }
five8_const = { workspace = true }
# bytemuck is brought in transitively via hopper-native when the
# native backend is active, but we also need direct access here to
# emit `unsafe impl bytemuck::Pod` on runtime-owned types like
# `Address`. `default-features = false` keeps this no_std-friendly.
bytemuck = { version = "1", default-features = false }

[dev-dependencies]
# Property-based testing for the segment-borrow disjointness invariant.
# Host-only (`cargo test`); never compiled into the no_std SBF build.
proptest = "1"

[lints]
workspace = true
