[package]
name = "hopper-runtime"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
description = "Canonical low-level runtime surface for Hopper programs: direct account memory, validation, borrow guards, CPI, and zero-copy state access."
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
homepage = "https://hopperzero.dev"
documentation = "https://docs.rs/crate/hopper-runtime/0.2.1"
readme = "README.md"
keywords = ["solana", "zero-copy", "runtime", "no-std", "framework"]
categories = ["no-std", "embedded"]

[lib]
name = "hopper_runtime"

[features]
default = []

cu-trace = ["hopper-native/cu-trace"]
# Opt-in SIMD-0321 two-argument fast entrypoint. See hopper-native's
# feature of the same name; without it `hopper_fast_entrypoint!` is an
# alias for the standard scanning entrypoint.
simd-0321 = ["hopper-native/simd-0321"]
cpi = []
copy = []
legacy-token-instructions = []
crypto-curve = []
crypto-poseidon = []
crypto-bn254 = []
crypto-big-mod-exp = []

[dependencies]
hopper-native = { workspace = true, default-features = false, features = ["cpi"] }

[dev-dependencies]
# Property-based testing for the segment-borrow disjointness invariant.
# Host-only (`cargo test`); never compiled into the no_std SBF build.
proptest = "1"

[lints]
workspace = true
