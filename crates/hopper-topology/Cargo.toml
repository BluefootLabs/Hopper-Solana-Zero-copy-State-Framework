[package]
name = "hopper-topology"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic profile-guided account-topology analysis for Solana programs"
authors = ["BluefootLabs <contact@bluefootlabs.com>", "MoonManQuark"]
repository = "https://github.com/BluefootLabs/Hopper-Solana-Zero-copy-State-Framework"
readme = "README.md"
keywords = ["solana", "sharding", "contention", "topology", "profiling"]
categories = ["development-tools"]

[lib]
name = "hopper_topology"

[[bin]]
name = "hopper-topology"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
