[package]
name = "hopper-test"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
authors = ["QuarksBlueFoot <quark@bluefoot.tech>"]
description = "Reusable in-process SVM harness for testing Hopper programs without a validator."

[dependencies]
mollusk-svm = "0.15"
solana-account = "4.3.1"
solana-pubkey = { version = "4.2.1", features = ["std", "rand"] }
solana-instruction = "3.4.0"
# Same log-collector crate Mollusk wires into the invoke context; a
# direct dependency so the harness can hand out the captured
# `Program log:` / `Program data:` stream (touch-map and event
# decoding tests read it).
solana-svm-log-collector = "4.2"

[lints]
workspace = true
