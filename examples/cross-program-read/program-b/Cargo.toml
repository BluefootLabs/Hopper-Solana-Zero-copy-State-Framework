[package]
name = "hopper-xp-program-b"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Cross-program read example - Program B (vault reader via hopper_interface!)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../../..", package = "hopper-lang", default-features = false }

[features]
default = []
hopper-native-backend = []
legacy-pinocchio-compat = []
solana-program-backend = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
