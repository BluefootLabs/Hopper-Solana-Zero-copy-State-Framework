[package]
name = "hopper-xp-devnet-runner"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Devnet runner for the Hopper cross-program read proof."

[dependencies]
hopper = { path = "../../..", package = "hopper-lang", default-features = false }
hopper-xp-program-a = { path = "../program-a" }
solana-client = { version = "=4.2.1" }
solana-commitment-config = { version = "=3.1.1" }
solana-instruction = { version = "=3.4.0" }
solana-keypair = { version = "=3.1.2" }
solana-pubkey = { version = "=4.2.1" }
solana-signer = { version = "=3.0.1" }
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"] }

[lints]
workspace = true
