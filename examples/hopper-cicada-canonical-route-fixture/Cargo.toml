[package]
name = "hopper-cicada-canonical-route-fixture"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Canonical SPL Token CPI route fixture for Cicada SVM lifecycle tests."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }

[dev-dependencies]
hopper-test = { path = "../../crates/hopper-test" }
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token"] }
solana-account = "4.3.1"
solana-instruction = "3.4.0"
solana-pubkey = { version = "4.2.1", features = ["std", "rand"] }

[features]
default = []

[lints]
workspace = true
