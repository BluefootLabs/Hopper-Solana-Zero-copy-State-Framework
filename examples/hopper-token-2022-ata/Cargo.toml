[package]
name = "hopper-token-2022-ata"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hopper-authored example using Hopper-owned ATA and Token-2022 surfaces"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }