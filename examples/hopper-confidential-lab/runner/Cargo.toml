[package]
name = "hopper-confidential-lab-runner"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Runs the confidential lab's whole flow on a public cluster, with proofs generated off chain."

[dependencies]
bytemuck = "1"
hopper-confidential-lab = { path = ".." }
serde_json = "1"
sha2 = "0.10"
solana-client = { version = "=4.2.1" }
solana-commitment-config = { version = "=3.1.1" }
solana-compute-budget-interface = "=3.0.0"
solana-instruction = { version = "=3.4.0" }
solana-keypair = { version = "=3.1.2" }
solana-pubkey = { version = "=4.2.1" }
solana-signer = { version = "=3.0.1" }
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"] }
solana-zk-elgamal-proof-interface = "0.1.3"
solana-zk-sdk = "7.0.1"
spl-elgamal-registry-interface = "0.2.1"
spl-token-2022-interface = "3.1.1"
spl-token-confidential-transfer-proof-extraction = "0.6.0"
spl-token-confidential-transfer-proof-generation = "0.6.1"

[lints]
workspace = true
