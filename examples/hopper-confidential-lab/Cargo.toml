[package]
name = "hopper-confidential-lab"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Every Token-2022 confidential-transfer instruction Hopper builds, run against the real Token-2022 program and the ZK ElGamal proof program with proofs generated off chain."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[dev-dependencies]
bytemuck = "1"
sha2 = "0.10"
hopper-test = { path = "../../crates/hopper-test" }
mollusk-svm = { version = "0.15.1", features = ["all-builtins"] }
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token-2022"] }
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.1"
solana-zk-sdk = "7.0.1"
spl-elgamal-registry-interface = "0.2.1"
solana-zk-elgamal-proof-interface = "0.1.3"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-2022-interface = "3.1.1"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
