[package]
name = "hopper-compact-vault"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Three-tier metadata example: a Tier-1 compact account plus a Tier-2 on-chain registry."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { workspace = true, features = ["proc-macros"] }

[dev-dependencies]
hopper-schema = { workspace = true }
solana-client = "2.1"
solana-commitment-config = "2.1"
solana-instruction = "2.1"
solana-keypair = "2.1"
solana-pubkey = "2.1"
solana-signer = "2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-transaction = { version = "2.1", features = ["bincode"] }

[lints]
workspace = true
