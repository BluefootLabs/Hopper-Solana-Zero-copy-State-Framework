[package]
name = "hopper-compact-vault"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Three-tier metadata example: a Tier-1 compact account plus a Tier-2 on-chain registry."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { workspace = true, features = ["proc-macros"] }

[dev-dependencies]
hopper-schema = { workspace = true }
solana-client = "=4.2.1"
solana-commitment-config = "=3.1.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-pubkey = "=4.2.1"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"] }

[lints]
workspace = true
