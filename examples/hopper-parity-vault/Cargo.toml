[package]
name = "hopper-parity-vault"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }

[features]
default = []
# Forwarded intrinsic overrides (I18). Off by default: the primary CU
# baseline is measured without them; a later phase builds the variant.
builtins = ["hopper/builtins"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }