[package]
name = "hopper-parity-vault"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }

[features]
# Raw-tier size opt-out for the BENCHMARKED artifact only: build with
# `cargo build-sbf -- --features unguarded-raw-surfaces`. Never a default,
# so workspace feature unification cannot disable the guard for the
# strict-writes programs sharing this workspace.
unguarded-raw-surfaces = ["hopper/unguarded-raw-surfaces"]
default = []
# Forwarded intrinsic overrides (builtins). Off by default: the primary CU
# baseline is measured without them; a later phase builds the variant.
builtins = ["hopper/builtins"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }