[package]
name = "hopper-smoke"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "End-to-end Hopper smoke-test program: init/CPI/sysvar/event/close exercised on devnet."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# `touch-map` (forwarded by the facade to hopper-runtime/touch-map) arms
# the self-describing-transaction machinery that the `emit_touch_map`
# opt-in on the `Withdraw` context drives. It is enabled here — for this
# example only — precisely because the emission is per-context opt-in:
# nothing else in the workspace pays for it.
hopper = { workspace = true, features = ["proc-macros", "touch-map"] }

[dev-dependencies]
# In-process SVM harness (Mollusk) so the touch-map loop is proven
# end-to-end against the compiled SBF artifact: run `cargo build-sbf`
# in this directory first, then `cargo test -p hopper-smoke`.
hopper-test = { path = "../../crates/hopper-test" }
base64 = "0.22"
solana-account = "3.2.0"
solana-instruction = "3.0"
solana-pubkey = "4.1.0"

[lints]
workspace = true
