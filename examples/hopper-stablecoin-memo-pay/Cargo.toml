[package]
name = "hopper-stablecoin-memo-pay"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Devnet-ready Hopper stablecoin payment ledger with TransferChecked and Memo CPI."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[features]
default = []

[lints]
workspace = true
