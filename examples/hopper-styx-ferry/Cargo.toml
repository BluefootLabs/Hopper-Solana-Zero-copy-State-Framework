[package]
name = "hopper-styx-ferry"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hopper port of Styx-style prekeys, ratchet envelopes, and ZK ferry verifier calls."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[features]
default = []
hopper-native-backend = []
legacy-pinocchio-compat = []
solana-program-backend = []

[lints]
workspace = true