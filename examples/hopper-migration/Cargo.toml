[package]
name = "hopper-migration"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }
hopper-schema = { path = "../../crates/hopper-schema" }

[dev-dependencies]
solana-client = "2.1"
solana-keypair = "2.1"
solana-pubkey = "2.1"
solana-signer = "2.1"
solana-instruction = "2.1"
solana-transaction = { version = "2.1", features = ["bincode"] }
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-commitment-config = "2.1"

[features]
default = ["migrate"]
migrate = ["hopper/migrate"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
