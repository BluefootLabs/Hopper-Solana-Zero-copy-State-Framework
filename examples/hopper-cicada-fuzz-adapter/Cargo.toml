[package]
name = "hopper-cicada-fuzz-adapter"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Host-only semantic adapter for Cicada's manifest-derived fuzz plan."

[[bin]]
name = "hopper-cicada-fuzz-adapter"
path = "src/main.rs"

[dependencies]
hopper-cicada = { path = "../hopper-cicada" }
hopper-schema = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
