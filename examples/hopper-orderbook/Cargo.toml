[package]
name = "hopper-orderbook"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Segment-borrow orderbook example: a >100 KB zero-copy account split into bids/asks/event-queue segments."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { workspace = true, features = ["proc-macros", "advanced"] }

[dev-dependencies]
solana-client = "2.1"
solana-keypair = "2.1"
solana-pubkey = "2.1"
solana-signer = "2.1"
solana-instruction = "2.1"
solana-transaction = { version = "2.1", features = ["bincode"] }
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-commitment-config = "2.1"

[lints]
workspace = true
