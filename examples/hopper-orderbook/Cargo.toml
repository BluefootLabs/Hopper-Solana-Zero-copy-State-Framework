[package]
name = "hopper-orderbook"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Segment-borrow orderbook example: a >100 KB zero-copy account split into bids/asks/event-queue segments."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { workspace = true, features = ["proc-macros", "advanced"] }

[dev-dependencies]
solana-client = "=4.2.1"
solana-keypair = "=3.1.2"
solana-pubkey = "=4.2.1"
solana-signer = "=3.0.1"
solana-instruction = "=3.4.0"
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"] }
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-commitment-config = "=3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
