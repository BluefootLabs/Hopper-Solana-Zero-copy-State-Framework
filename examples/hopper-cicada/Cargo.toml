[package]
name = "hopper-cicada"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Cicada transport-neutral execution intents with Hopper byte-scoped state authority."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros", "touch-map"] }

[dev-dependencies]
grillo-manifest = { path = "../../crates/grillo-manifest" }
grillo-verifier = { path = "../../crates/grillo-verifier" }
hopper-runtime = { path = "../../crates/hopper-runtime", features = ["thread-local-registry"] }
hopper-test = { path = "../../crates/hopper-test" }
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token", "token-2022"] }
solana-account = "4.3.1"
solana-instruction = "3.4.0"
solana-pubkey = "4.2.1"

[features]
default = []

[lints]
workspace = true
