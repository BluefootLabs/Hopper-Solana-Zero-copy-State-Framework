[package]
name = "hopper-token-2022-transfer-hook"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hopper Token-2022 example that validates the TransferHook mint extension, binds an expected hook program, and rejects unsupported extensions."

[lib]
crate-type = ["cdylib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
