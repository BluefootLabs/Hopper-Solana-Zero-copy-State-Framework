[package]
name = "hopper-tail-lab"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Devnet Hopper program exercising bounded dynamic fields and bare final tails."

[lib]
crate-type = ["cdylib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[dev-dependencies]
hopper-test = { path = "../../crates/hopper-test" }
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.1"

[features]
default = []

[lints]
workspace = true