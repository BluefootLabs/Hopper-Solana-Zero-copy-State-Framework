[package]
name = "hopper-token-2022-vault"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hopper-authored Token-2022 vault example with package-local manifest tooling"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false }

[dev-dependencies]
hopper-test = { path = "../../crates/hopper-test" }
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["associated-token", "token-2022"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "=4.3.1"
solana-client = "=4.2.1"
solana-commitment-config = "=3.1.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-pubkey = "=4.2.1"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"] }
spl-associated-token-account-interface = "=2.0.0"
spl-token-2022-interface = "=3.1.1"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
