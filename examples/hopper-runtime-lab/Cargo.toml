[package]
name = "hopper-runtime-lab"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The heap allocator, the panic handler, and the SlotHashes lookup, exercised on the real VM."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[dev-dependencies]
hopper-test = { path = "../../crates/hopper-test" }
solana-account = "=4.3.1"
solana-hash = "=4.5.0"
solana-slot-hashes = "=3.1.0"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.1"

[features]
default = []
# The build you debug with: a panic reports its message, file, line, and
# column before the transaction fails.
report-panics = ["hopper/panic-location", "hopper/panic-message"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
