[package]
name = "hopper-devnet-audit"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Devnet audit program exercising Hopper dynamic tails, contexts, segments, and substrate APIs."

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "devnet_audit"
path = "src/bin/devnet_audit.rs"
required-features = ["devnet-client"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-client = { version = "=4.2.1", optional = true }
solana-commitment-config = { version = "=3.1.1", optional = true }
solana-instruction = { version = "=3.4.0", optional = true }
solana-keypair = { version = "=3.1.2", optional = true }
solana-pubkey = { version = "=4.2.1", optional = true }
solana-signer = { version = "=3.0.1", optional = true }
solana-transaction = { version = "=4.1.4", features = ["serde", "wincode"], optional = true }

[features]
default = []
devnet-client = [
	"dep:solana-client",
	"dep:solana-commitment-config",
	"dep:solana-instruction",
	"dep:solana-keypair",
	"dep:solana-pubkey",
	"dep:solana-signer",
	"dep:solana-transaction",
]

[lints]
workspace = true
