[package]
name = "hopper-token-lab"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Every SPL Token and Token-2022 builder Hopper ships, exercised on chain: multisig, immutable-owner accounts, data-size and UI-amount queries, excess-lamport withdrawal, wrapped SOL unwrap, batched transfers, and the extended mints."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hopper = { path = "../..", package = "hopper-lang", default-features = false, features = ["proc-macros"] }

[dev-dependencies]
hopper-test = { path = "../../crates/hopper-test" }
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token", "token-2022"] }
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.1"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
