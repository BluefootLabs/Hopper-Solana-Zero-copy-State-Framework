[package]
name = "hopper-framework-verifier"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Host-side Mollusk runner that proves and measures the framework-comparison fixtures; same command line and checks as pina's verifier."

# Host-side tool: it loads a compiled SBF ELF into a Mollusk VM and reports
# the compute units each instruction consumes. It never ships on-chain.

[[bin]]
name = "framework-verifier"
path = "src/main.rs"

[dependencies]
mollusk-svm = "0.15"
solana-account = "4.3.1"
solana-instruction = "3.4.0"
solana-pubkey = "4.2.1"
solana-sdk-ids = "3"
solana-svm-log-collector = "4.2"

[dev-dependencies]
solana-instruction-error = "2.5"
hopper = { workspace = true, features = ["proc-macros"] }

[lints]
workspace = true
